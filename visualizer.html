<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>chooon-viz 2.0</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      font-family: monospace;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      pointer-events: none;
      transition: background 0.3s, color 0.3s;
    }
    #status.connected {
      background: rgba(0, 255, 80, 0.15);
      color: #00ff50;
      border: 1px solid rgba(0, 255, 80, 0.4);
    }
    #status.disconnected {
      background: rgba(255, 40, 40, 0.15);
      color: #ff4040;
      border: 1px solid rgba(255, 40, 40, 0.4);
    }
  </style>
</head>
<body>

<div id="status" class="disconnected">Disconnected</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // ── Three.js bootstrap ──────────────────────────────────────────────────────
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 1);
  document.body.appendChild(renderer.domElement);

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 5;

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();

  // ── Status indicator ────────────────────────────────────────────────────────
  const statusEl = document.getElementById('status');

  function setStatus(connected) {
    statusEl.textContent   = connected ? 'Connected' : 'Disconnected';
    statusEl.className     = connected ? 'connected'  : 'disconnected';
  }

  // ── WebSocket ───────────────────────────────────────────────────────────────
  const WS_URL    = 'ws://localhost:8765';
  const RECONNECT = 2000; // ms between reconnect attempts

  function connect() {
    const ws = new WebSocket(WS_URL);

    ws.addEventListener('open', () => {
      setStatus(true);
      console.log('[chooon-viz] WebSocket connected to', WS_URL);
    });

    ws.addEventListener('message', (event) => {
      try {
        const data = JSON.parse(event.data);
        console.log('[audio]', data);
        // data.beat          — boolean
        // data.beat_strength — float 0-1
        // data.volume        — float 0-1
        // data.band_energy   — float[] (per-band energy)
        // data.dominant_freq — float Hz
      } catch (err) {
        console.warn('[chooon-viz] Failed to parse message:', event.data);
      }
    });

    ws.addEventListener('close', () => {
      setStatus(false);
      console.log('[chooon-viz] WebSocket closed. Reconnecting in', RECONNECT, 'ms…');
      setTimeout(connect, RECONNECT);
    });

    ws.addEventListener('error', (err) => {
      console.error('[chooon-viz] WebSocket error:', err);
      ws.close();
    });
  }

  connect();
</script>
</body>
</html>
