<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>chooon-viz 2.0</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      font-family: monospace;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      pointer-events: none;
      transition: background 0.3s, color 0.3s;
    }
    #status.connected {
      background: rgba(0, 255, 80, 0.15);
      color: #00ff50;
      border: 1px solid rgba(0, 255, 80, 0.4);
    }
    #status.disconnected {
      background: rgba(255, 40, 40, 0.15);
      color: #ff4040;
      border: 1px solid rgba(255, 40, 40, 0.4);
    }

    /* ── Drop zone overlay ── */
    #drop-zone {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      pointer-events: none; /* canvas underneath handles drag events */
      transition: opacity 0.4s;
    }
    #drop-zone.hidden { opacity: 0; pointer-events: none; }

    #drop-ring {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s;
    }
    #drop-ring svg { opacity: 0.25; transition: opacity 0.2s; }

    #drop-label {
      font-family: monospace;
      font-size: 13px;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.25);
      transition: color 0.2s;
    }

    /* Drag-over state (toggled on body) */
    body.drag-over #drop-ring        { border-color: rgba(255, 255, 255, 0.75); }
    body.drag-over #drop-ring svg    { opacity: 0.85; }
    body.drag-over #drop-label       { color: rgba(255, 255, 255, 0.75); }
  </style>
</head>
<body>

<div id="status" class="disconnected">Disconnected</div>

<div id="drop-zone">
  <div id="drop-ring">
    <!-- upload / photo icon -->
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none"
         stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
  </div>
  <div id="drop-label">Drop a photo to begin</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // ── Three.js bootstrap ──────────────────────────────────────────────────────
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 1);
  document.body.appendChild(renderer.domElement);

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 5;

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    resizePhoto(); // re-fit if a photo is loaded
  });

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();

  // ── Status indicator ────────────────────────────────────────────────────────
  const statusEl = document.getElementById('status');
  function setStatus(connected) {
    statusEl.textContent = connected ? 'Connected' : 'Disconnected';
    statusEl.className   = connected ? 'connected'  : 'disconnected';
  }

  // ── Vignette shader ─────────────────────────────────────────────────────────
  const vertexShader = /* glsl */`
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `;

  // Radial vignette: full brightness at center, pure black at edges.
  // dist goes 0→1 across the inscribed circle; smoothstep pulls it down
  // starting at 0.35 so the fade feels generous but complete at 1.0.
  const fragmentShader = /* glsl */`
    uniform sampler2D uTexture;
    varying vec2 vUv;

    void main() {
      vec4 texColor = texture2D(uTexture, vUv);

      float dist     = length(vUv - 0.5) * 2.0;          // 0 center → ~1.41 corners
      float vignette = 1.0 - smoothstep(0.35, 1.05, dist); // fade band

      gl_FragColor = vec4(texColor.rgb * vignette, texColor.a);
    }
  `;

  // ── Photo plane ─────────────────────────────────────────────────────────────
  let photoMesh = null;

  // World-space height visible at z=0 given the current camera
  function visibleWorldHeight() {
    const halfFovRad = THREE.MathUtils.degToRad(camera.fov / 2);
    return 2 * Math.tan(halfFovRad) * camera.position.z;
  }

  // Scale the plane so the photo fills 60% of screen height, aspect preserved
  function resizePhoto() {
    if (!photoMesh) return;
    const { imgW, imgH } = photoMesh.userData;
    const h = visibleWorldHeight() * 0.6;
    const w = h * (imgW / imgH);
    photoMesh.scale.set(w, h, 1);
  }

  function loadPhoto(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const texture       = new THREE.Texture(img);
        texture.needsUpdate = true;

        const mat = new THREE.ShaderMaterial({
          uniforms:       { uTexture: { value: texture } },
          vertexShader,
          fragmentShader,
        });
        const geo = new THREE.PlaneGeometry(1, 1); // actual size applied via scale

        // Clean up previous photo
        if (photoMesh) {
          photoMesh.material.uniforms.uTexture.value.dispose();
          photoMesh.material.dispose();
          photoMesh.geometry.dispose();
          scene.remove(photoMesh);
        }

        photoMesh = new THREE.Mesh(geo, mat);
        photoMesh.userData = { imgW: img.naturalWidth, imgH: img.naturalHeight };
        scene.add(photoMesh);
        resizePhoto();

        document.getElementById('drop-zone').classList.add('hidden');
        console.log(`[chooon-viz] Photo loaded: ${img.naturalWidth}×${img.naturalHeight} — ${file.name}`);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ── Drag-and-drop ───────────────────────────────────────────────────────────
  const canvas = renderer.domElement;

  // Prevent browser from navigating to dropped file
  window.addEventListener('dragover',  (e) => e.preventDefault());
  window.addEventListener('drop',      (e) => e.preventDefault());

  canvas.addEventListener('dragenter', ()  => document.body.classList.add('drag-over'));
  canvas.addEventListener('dragover',  (e) => e.preventDefault());
  canvas.addEventListener('dragleave', ()  => document.body.classList.remove('drag-over'));

  canvas.addEventListener('drop', (e) => {
    e.preventDefault();
    document.body.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
      loadPhoto(file);
    } else {
      console.warn('[chooon-viz] Dropped item is not an image:', file?.type ?? 'unknown');
    }
  });

  // ── WebSocket ───────────────────────────────────────────────────────────────
  const WS_URL    = 'ws://localhost:8765';
  const RECONNECT = 2000;

  function connect() {
    const ws = new WebSocket(WS_URL);

    ws.addEventListener('open', () => {
      setStatus(true);
      console.log('[chooon-viz] WebSocket connected to', WS_URL);
    });

    ws.addEventListener('message', (event) => {
      try {
        const data = JSON.parse(event.data);
        console.log('[audio]', data);
        // data.beat          — boolean
        // data.beat_strength — float 0-1
        // data.volume        — float 0-1
        // data.band_energy   — float[] (per-band energy)
        // data.dominant_freq — float Hz
      } catch (err) {
        console.warn('[chooon-viz] Failed to parse message:', event.data);
      }
    });

    ws.addEventListener('close', () => {
      setStatus(false);
      console.log('[chooon-viz] WebSocket closed. Reconnecting in', RECONNECT, 'ms…');
      setTimeout(connect, RECONNECT);
    });

    ws.addEventListener('error', (err) => {
      console.error('[chooon-viz] WebSocket error:', err);
      ws.close();
    });
  }

  connect();
</script>
</body>
</html>
