<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>chooon-viz 2.0</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }
    .hidden { opacity: 0 !important; pointer-events: none !important; }

    /* ── Status chip ── */
    #status {
      position: fixed; top: 12px; left: 12px;
      font-family: monospace; font-size: 11px;
      padding: 4px 8px; border-radius: 4px;
      pointer-events: none;
      transition: background 0.3s, color 0.3s;
    }
    #status.connected    { background: rgba(0,255,80,0.15);  color: #00ff50; border: 1px solid rgba(0,255,80,0.4); }
    #status.disconnected { background: rgba(255,40,40,0.15); color: #ff4040; border: 1px solid rgba(255,40,40,0.4); }

    /* ── Drop zone ── */
    #drop-zone {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      pointer-events: none;
      transition: opacity 0.4s;
    }
    #drop-ring {
      width: 160px; height: 160px; border-radius: 50%;
      border: 2px dashed rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s;
    }
    #drop-ring svg    { opacity: 0.25; transition: opacity 0.2s; }
    #drop-label       { font-family: monospace; font-size: 13px; letter-spacing: 0.06em; color: rgba(255,255,255,0.25); transition: color 0.2s; }
    body.drag-over #drop-ring     { border-color: rgba(255,255,255,0.75); }
    body.drag-over #drop-ring svg { opacity: 0.85; }
    body.drag-over #drop-label    { color: rgba(255,255,255,0.75); }

    /* ── Counter ── */
    #counter {
      position: fixed; bottom: 14px; right: 16px;
      font-family: monospace; font-size: 11px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.04em;
      user-select: none;
      transition: opacity 0.3s, color 0.2s;
    }
    #counter.clickable         { cursor: pointer; color: rgba(255,255,255,0.7); }
    #counter.clickable:hover   { color: #fff; }

    /* ── Ellipse outline overlay canvas ── */
    #overlay-canvas {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* ── Vignette center handle ── */
    #v-handle {
      position: fixed;
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.2);
      transform: translate(-50%, -50%);
      cursor: grab;
      z-index: 2;
      transition: opacity 0.25s;
      box-shadow: 0 0 8px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,0,0,0.3);
    }
    #v-handle:active { cursor: grabbing; }

    /* ── Vignette edge handle (scale + ellipseRatio) ── */
    #v-edge-handle {
      position: fixed;
      width: 13px; height: 13px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.75);
      background: rgba(255,255,255,0.1);
      transform: translate(-50%, -50%);
      cursor: grab;
      z-index: 2;
      transition: opacity 0.25s;
      box-shadow: 0 0 6px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,0,0,0.3);
    }
    #v-edge-handle:active { cursor: grabbing; }

    /* ── Setup controls ── */
    #setup-controls {
      position: fixed; bottom: 24px;
      left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px;
      z-index: 3;
      transition: opacity 0.3s;
    }
    #setup-controls button {
      font-family: monospace; font-size: 12px;
      padding: 6px 20px; border-radius: 4px;
      border: none; cursor: pointer;
      letter-spacing: 0.04em;
    }
    #btn-lock { background: #2a7a3b; color: #fff; }
    #btn-lock:hover { background: #35a04d; }
    #btn-skip { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.65); }
    #btn-skip:hover { background: rgba(255,255,255,0.18); }
    #setup-controls label {
      font-family: monospace; font-size: 11px;
      color: rgba(255,255,255,0.55);
      display: flex; align-items: center; gap: 5px;
      cursor: pointer; user-select: none;
    }
    #setup-controls label:hover { color: rgba(255,255,255,0.85); }

    /* ── Queue popover ── */
    #queue-popover {
      position: fixed; bottom: 40px; right: 12px;
      background: rgba(10,10,10,0.93);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      min-width: 200px; max-width: 340px;
      max-height: 300px; overflow-y: auto;
      padding: 6px 0;
      transition: opacity 0.2s;
      z-index: 20;
    }
    .pop-item {
      font-family: monospace; font-size: 11px;
      color: rgba(255,255,255,0.65);
      padding: 5px 14px;
      cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pop-item:hover  { background: rgba(255,255,255,0.07); color: #fff; }
    .pop-item.active { color: #00ff80; }
  </style>
</head>
<body>

<div id="status" class="disconnected">Disconnected</div>

<div id="drop-zone">
  <div id="drop-ring">
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none"
         stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
  </div>
  <div id="drop-label">Drop photos or a folder to begin</div>
</div>

<canvas id="overlay-canvas"></canvas>

<div id="counter"         class="hidden"></div>
<div id="v-handle"        class="hidden"></div>
<div id="v-edge-handle"   class="hidden"></div>
<div id="setup-controls"  class="hidden">
  <button id="btn-skip">Skip</button>
  <label><input type="checkbox" id="cb-vignette" checked> Vignette</label>
  <button id="btn-lock">Lock</button>
</div>
<div id="queue-popover" class="hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════════
// Three.js bootstrap
// ═══════════════════════════════════════════════════════════════════════════════
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 5;

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  rtScene.setSize(window.innerWidth, window.innerHeight);
  rtEchoA.setSize(window.innerWidth, window.innerHeight);
  rtEchoB.setSize(window.innerWidth, window.innerHeight);
  rtTile.setSize(window.innerWidth, window.innerHeight);
  rtKaleid.setSize(window.innerWidth, window.innerHeight);
  resizeOverlayCanvas();
  resizePhoto();
  updateAllHandles();
});

function animate(ts = 0) {
  requestAnimationFrame(animate);

  // Delta time in seconds, capped to avoid huge jumps after tab blur
  const dt  = Math.min((ts - prevTimestamp) / 1000.0, 0.1);
  prevTimestamp = ts;
  shaderTime   += dt;

  // Vignette morph — update regardless of photoMesh existence
  vignettePulseDecay = Math.max(0, vignettePulseDecay - dt * 3.0);
  breathEnvelope     = Math.sin(shaderTime * 1.2);   // ~1.2 rad/s breathing cycle

  if (photoMesh) {
    const u = photoMesh.material.uniforms;

    // Feed audio values — effectIntensity scales bass displacement + chromatic aberration
    u.uBass.value         = (audioData.bandEnergy[1] ?? 0) * effectIntensity;
    u.uBeatFlash.value    = beatFlash;
    u.uBeatStrength.value = beatStrengthDecay * effectIntensity;
    u.uTime.value         = shaderTime;

    // Vignette morph uniforms
    u.uPulseAmount.value   = pulseEnabled   ? vignettePulseDecay * pulseAmplitude : 0;
    u.uWobbleFreq.value    = wobbleFreq;
    u.uWobbleAmp.value     = wobbleEnabled  ? wobbleAmp                           : 0;
    u.uBreath.value        = breathEnvelope;
    u.uBreatheAmount.value = breatheEnabled ? breatheAmplitude                    : 0;

    // Exponential-style linear decay toward zero
    beatFlash         = Math.max(0, beatFlash         - dt / BEAT_FLASH_DECAY);
    beatStrengthDecay = Math.max(0, beatStrengthDecay - dt / BEAT_STRENGTH_DECAY);
  }

  // ── Tile offset drift + beat scramble ─────────────────────────────────────
  if (tileEnabled) {
    const n = tileGrid * tileGrid;
    for (let i = 0; i < n; i++) {
      tileOffsets[i].x += (Math.random() - 0.5) * 0.004;
      tileOffsets[i].y += (Math.random() - 0.5) * 0.004;
    }
    if (tileBeatPending) {
      for (let i = 0; i < n; i++) {
        tileOffsets[i].x += (Math.random() - 0.5) * 2.0 * tileScramble;
        tileOffsets[i].y += (Math.random() - 0.5) * 2.0 * tileScramble;
      }
    }
    tileMat.uniforms.uTileGrid.value = tileGrid;
    // Array elements mutated in-place; Three.js re-uploads vec2 array each frame
  }
  tileBeatPending = false;  // clear even when disabled, so no stale beats on enable

  // ── Render pipeline ───────────────────────────────────────────────────────
  // 1. Photo scene (vignette + shaders) → rtScene
  renderer.setRenderTarget(rtScene);
  renderer.render(scene, camera);

  // 2. Tile pass: rtScene → rtTile  (skipped if disabled — tileSource stays rtScene)
  let tileSource = rtScene;
  if (tileEnabled) {
    tileMat.uniforms.uTex.value = rtScene.texture;
    renderer.setRenderTarget(rtTile);
    renderer.render(tileScene, tileCamera);
    tileSource = rtTile;
  }

  // 3. Kaleidoscope pass: [tile result] → rtKaleid  (skipped if disabled)
  let kaleidSource = tileSource;
  if (kaleidEnabled) {
    kaleidMat.uniforms.uTex.value        = tileSource.texture;
    kaleidMat.uniforms.uKaleidFolds.value = kaleidFolds;
    renderer.setRenderTarget(rtKaleid);
    renderer.render(kaleidScene, kaleidCamera);
    kaleidSource = rtKaleid;
  }

  // 4. Echo feedback: [kaleid result] + rtEchoA → rtEchoB
  feedbackMat.uniforms.uCurrentFrame.value  = kaleidSource.texture;
  feedbackMat.uniforms.uPreviousFrame.value = rtEchoA.texture;
  feedbackMat.uniforms.uDecay.value         = echoDecay;
  feedbackMat.uniforms.uScale.value         = echoScale;
  feedbackMat.uniforms.uRotation.value      = echoRotation;
  feedbackMat.uniforms.uBass.value          = audioData.bandEnergy[1] ?? 0;
  feedbackMat.uniforms.uVolume.value        = audioData.volume;
  renderer.setRenderTarget(rtEchoB);
  renderer.render(feedbackScene, feedbackCamera);

  // 5. Blit echo result to screen
  blitMat.uniforms.uMap.value = rtEchoB.texture;
  renderer.setRenderTarget(null);
  renderer.render(blitScene, blitCamera);

  // 6. Swap echo ping-pong buffers
  const tmp = rtEchoA; rtEchoA = rtEchoB; rtEchoB = tmp;
}
animate();

// ═══════════════════════════════════════════════════════════════════════════════
// Status chip
// ═══════════════════════════════════════════════════════════════════════════════
const statusEl = document.getElementById('status');
function setStatus(connected) {
  statusEl.textContent = connected ? 'Connected' : 'Disconnected';
  statusEl.className   = connected ? 'connected'  : 'disconnected';
}

// ═══════════════════════════════════════════════════════════════════════════════
// Shaders
// Vertex:   uBass-driven radial ripple + centre bulge displacement (32×32 mesh)
// Fragment: elliptical vignette · chromatic aberration · film grain · beat flash
// ═══════════════════════════════════════════════════════════════════════════════
const vertexShader = /* glsl */`
  varying vec2 vUv;
  uniform float uBass; // 0-1, drives displacement amplitude
  uniform float uTime; // seconds, animates ripple propagation

  void main() {
    vUv = uv;
    vec3 pos = position;

    // Radial distance from plane centre (0 at centre, ~1.41 at corners)
    float dist = length(uv - 0.5) * 2.0;

    // Animated sine-wave ripple — amplitude scales with bass
    float ripple = sin(dist * 10.0 - uTime * 5.0) * uBass * 0.08;

    // Smooth dome bulge: centre pushes forward, falls off toward edges
    float bulge  = (1.0 - smoothstep(0.0, 1.2, dist)) * uBass * 0.12;

    pos.z += ripple + bulge;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
  }
`;

const fragmentShader = /* glsl */`
  uniform sampler2D uTexture;
  uniform vec2  uVignetteCenter;  // UV 0..1
  uniform float uVignetteAspect;  // imgW / imgH  (photo shape)
  uniform float uVignetteScale;   // overall size — larger = smaller ellipse
  uniform float uEllipseRatio;    // user h:w adjustment (default 1.0)
  uniform bool  uVignetteEnabled; // when false, skip all vignette math
  uniform float uBeatStrength;    // 0-1, drives chromatic aberration (with decay)
  uniform float uBeatFlash;       // 0-1, brief brightness spike on each beat
  uniform float uTime;            // seconds, drives film-grain animation
  // Vignette morph
  uniform float uPulseAmount;     // beat-driven scale addend (JS: pulseDecay * amplitude)
  uniform float uWobbleFreq;      // waves around perimeter (2–12)
  uniform float uWobbleAmp;       // wobble displacement (0 = disabled)
  uniform float uBreath;          // breathe envelope value (−1..1 sine)
  uniform float uBreatheAmount;   // breathe amplitude multiplier (0 = disabled)

  varying vec2 vUv;

  // Fast spatial hash for film grain
  float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
  }

  void main() {
    // ── Chromatic aberration ─────────────────────────────────────────────────
    float ab  = uBeatStrength * 0.015;
    float r   = texture2D(uTexture, vUv - vec2(ab, 0.0)).r;
    float g   = texture2D(uTexture, vUv).g;
    float b   = texture2D(uTexture, vUv + vec2(ab, 0.0)).b;
    vec4 texColor = vec4(r, g, b, texture2D(uTexture, vUv).a);

    float grain = hash(vUv * 800.0 + vec2(uTime * 7.3, uTime * 11.7)) - 0.5;

    if (uVignetteEnabled) {
      // ── Elliptical vignette with morph effects ─────────────────────────────
      vec2  d        = vUv - uVignetteCenter;
      float angle    = atan(d.y, d.x);
      // Effective scale: base + edge-pulse addend + breathe oscillation
      float effScale = uVignetteScale + uPulseAmount + uBreath * uBreatheAmount;
      float vDist    = length(vec2(d.x / (uVignetteAspect * uEllipseRatio), d.y))
                         * effScale * 2.0;
      // Edge wobble: perturb distance by a sine wave around the perimeter
      vDist         += sin(angle * uWobbleFreq + uTime * 2.0) * uWobbleAmp;
      float vignette = 1.0 - smoothstep(0.35, 1.05, vDist);
      texColor.rgb  *= vignette;
      // Film grain follows vignette mask so edges stay black
      texColor.rgb  += grain * 0.04 * vignette;
    } else {
      // No vignette: full image, grain applied uniformly
      texColor.rgb  += grain * 0.04;
    }

    // ── Beat flash ───────────────────────────────────────────────────────────
    texColor.rgb  *= (1.0 + uBeatFlash);

    gl_FragColor = texColor;
  }
`;

// ═══════════════════════════════════════════════════════════════════════════════
// App state
// ═══════════════════════════════════════════════════════════════════════════════
let queue          = [];      // File[] sorted alphabetically
let photoSettings  = {};      // { filename: { cx, cy, scale, ellipseRatio } }
let appMode        = 'idle';  // 'idle' | 'setup' | 'performance'

let currentPhotoIdx  = 0;
let setupPending     = [];
let editFromPerfIdx  = -1;

let photoMesh        = null;
let vignetteCenter   = { x: 0.5, y: 0.5 };
let vignetteScale    = 1.0;
let ellipseRatio     = 1.0;   // user-adjustable width:height multiplier
let vignetteEnabled  = true;  // per-photo vignette toggle

let perfTimer           = null;
let perfInterval        = 45000;   // ms, updated via BroadcastChannel
let dropMode            = true;    // true = drop-triggered advance, false = timer
let dropCooldown        = 30;      // seconds min between drop-triggered advances
let lastPhotoChangeTime = 0;       // Date.now() at last performance photo advance

// ═══════════════════════════════════════════════════════════════════════════════
// Audio state — updated by WebSocket, consumed by animate()
// ═══════════════════════════════════════════════════════════════════════════════
const audioData = {
  beat: false, beatStrength: 0, volume: 0,
  bandEnergy: [0, 0, 0, 0, 0, 0], dominantFreq: 0,
};

let beatFlash         = 0;   // spikes to 0.3 on beat, decays to 0
let beatStrengthDecay = 0;   // spikes to beat_strength, decays to 0
const BEAT_FLASH_DECAY     = 0.3;   // seconds to decay from peak to zero
const BEAT_STRENGTH_DECAY  = 0.4;  // seconds to decay from peak to zero

let prevTimestamp = 0;   // last RAF timestamp (ms)
let shaderTime    = 0;   // running shader clock (seconds)

// Control panel multipliers — updated via BroadcastChannel
let beatSensitivity = 1.35;  // 0.5–3.0: scales beat spike magnitude
let effectIntensity = 1.0;   // 0.0–2.0: master scale for bass + chromatic aberration

// Vignette morph state
let vignettePulseDecay = 0;     // spikes to 1.0 on beat, decays at 3.0/s
let breathEnvelope     = 0;     // sinusoidal breathe value (−1..1)
let pulseEnabled       = false;
let pulseAmplitude     = 0.1;
let wobbleEnabled      = false;
let wobbleFreq         = 6;
let wobbleAmp          = 0.05;
let breatheEnabled     = false;
let breatheAmplitude   = 0.15;

// ═══════════════════════════════════════════════════════════════════════════════
// Dub echo — feedback loop controls (expose for control panel later)
// ═══════════════════════════════════════════════════════════════════════════════
let echoDecay    = 0.92;    // 0.85–0.99  fraction of echo surviving each frame
let echoScale    = 0.997;   // 0.990–0.999 previous echo shrinks → tunnel zoom-in
let echoRotation = 0.002;   // 0.0–0.008  radians per frame the echo slowly spins

// Three render targets: current scene capture + two ping-pong echo accumulators
const rtScene = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight);
let   rtEchoA = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight);
let   rtEchoB = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight);

// Feedback shader — blends current frame with scaled/rotated previous echo
const feedbackVertShader = /* glsl */`
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

const feedbackFragShader = /* glsl */`
  uniform sampler2D uCurrentFrame;   // this frame's scene render
  uniform sampler2D uPreviousFrame;  // accumulated echo from last frame
  uniform float uDecay;              // 0–1: fraction of echo that survives
  uniform float uScale;              // < 1.0: echo shrinks inward → tunnel effect
  uniform float uRotation;           // radians/frame: echo slowly rotates
  uniform float uBass;               // 0–1: adds to rotation speed on bass hits
  uniform float uVolume;             // 0–1: adds to decay (louder = longer tails)

  varying vec2 vUv;

  void main() {
    vec2  center = vec2(0.5);
    vec2  d      = vUv - center;

    // Audio modulation — bass spins the tunnel, volume lengthens the tails
    float angle = uRotation + uBass * 0.005;
    float decay = min(0.985, uDecay + uVolume * 0.05);

    // Expand offset so previous echo appears slightly smaller (creates tunnel)
    vec2 sd = d / uScale;

    // Rotate the scaled offset for the previous-frame sample position
    float ca = cos(angle), sa = sin(angle);
    vec2  rd = vec2(sd.x * ca - sd.y * sa, sd.x * sa + sd.y * ca);

    vec4 current  = texture2D(uCurrentFrame,  vUv);
    vec4 previous = texture2D(uPreviousFrame, center + rd);

    // Additive blend — clamp prevents overexposure
    // Vignette's black edges ensure echo rings appear in dark border regions
    gl_FragColor = clamp(current + previous * decay, 0.0, 1.0);
  }
`;

const feedbackCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const feedbackScene  = new THREE.Scene();
const feedbackMat    = new THREE.ShaderMaterial({
  uniforms: {
    uCurrentFrame:  { value: null },
    uPreviousFrame: { value: null },
    uDecay:         { value: echoDecay },
    uScale:         { value: echoScale },
    uRotation:      { value: echoRotation },
    uBass:          { value: 0 },
    uVolume:        { value: 0 },
  },
  vertexShader:   feedbackVertShader,
  fragmentShader: feedbackFragShader,
});
feedbackScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), feedbackMat));

// Pass-through blit: renders echo buffer to the screen
const blitCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const blitScene  = new THREE.Scene();
const blitMat    = new THREE.ShaderMaterial({
  uniforms: { uMap: { value: null } },
  vertexShader:   `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D uMap; varying vec2 vUv; void main() { gl_FragColor = texture2D(uMap, vUv); }`,
});
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blitMat));

// ═══════════════════════════════════════════════════════════════════════════════
// Tile scramble pass — continuous UV drift + beat-triggered scramble
// ═══════════════════════════════════════════════════════════════════════════════
let tileEnabled     = false;
let tileGrid        = 4;       // 2–8, grid is NxN
let tileScramble    = 0.04;    // beat-jump magnitude in UV units
let tileBeatPending = false;   // set by WS handler, consumed by animate()

const TILE_MAX    = 64;        // supports up to 8×8 = 64 tiles
const tileOffsets = Array.from({ length: TILE_MAX }, () => new THREE.Vector2(0, 0));
const rtTile      = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight);

const tileFragShader = /* glsl */`
  uniform sampler2D uTex;
  uniform int       uTileGrid;
  uniform vec2      uTileOffsets[64];

  varying vec2 vUv;

  void main() {
    float n       = float(uTileGrid);
    vec2  tilePos = floor(vUv * n);          // tile coordinate, each axis 0..n-1
    int   idx     = int(tilePos.y) * uTileGrid + int(tilePos.x);
    vec2  offset  = uTileOffsets[idx];
    // Wrap within [0,1] so tiles sample from elsewhere in the image
    gl_FragColor  = texture2D(uTex, mod(vUv + offset, 1.0));
  }
`;

const tileCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const tileScene  = new THREE.Scene();
const tileMat    = new THREE.ShaderMaterial({
  uniforms: {
    uTex:         { value: null },
    uTileGrid:    { value: tileGrid },
    uTileOffsets: { value: tileOffsets },   // shared array, elements mutated in-place
  },
  vertexShader:   `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: tileFragShader,
});
tileScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), tileMat));

// ═══════════════════════════════════════════════════════════════════════════════
// Kaleidoscope pass — N-fold polar symmetry
// ═══════════════════════════════════════════════════════════════════════════════
let kaleidEnabled = false;
let kaleidFolds   = 4;   // 2–8 fold symmetry

const rtKaleid = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight);

const kaleidFragShader = /* glsl */`
  uniform sampler2D uTex;
  uniform int       uKaleidFolds;

  varying vec2 vUv;

  #define PI 3.14159265358979

  void main() {
    vec2  d  = vUv - 0.5;
    float r  = length(d);
    float a  = atan(d.y, d.x);              // [-PI, PI]
    a = mod(a + 2.0 * PI, 2.0 * PI);        // remap to [0, 2PI]

    float folds = float(uKaleidFolds);
    float seg   = 2.0 * PI / folds;         // angle of one segment
    float ai    = mod(a, seg);              // fold angle into [0, seg)
    if (ai > seg * 0.5) ai = seg - ai;     // mirror for smooth join at boundaries

    vec2 folded = r * vec2(cos(ai), sin(ai)) + 0.5;
    gl_FragColor = texture2D(uTex, clamp(folded, 0.0, 1.0));
  }
`;

const kaleidCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const kaleidScene  = new THREE.Scene();
const kaleidMat    = new THREE.ShaderMaterial({
  uniforms: {
    uTex:         { value: null },
    uKaleidFolds: { value: kaleidFolds },
  },
  vertexShader:   `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: kaleidFragShader,
});
kaleidScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), kaleidMat));

// ═══════════════════════════════════════════════════════════════════════════════
// Photo display helpers
// ═══════════════════════════════════════════════════════════════════════════════
function visibleWorldHeight() {
  const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
  return 2 * Math.tan(halfFov) * camera.position.z;
}

function resizePhoto() {
  if (!photoMesh) return;
  const { imgW, imgH } = photoMesh.userData;
  const h = visibleWorldHeight() * 0.6;
  photoMesh.scale.set(h * (imgW / imgH), h, 1);
}

// Pixel rectangle of the displayed photo (mirrors resizePhoto math)
function photoPixelBounds() {
  if (!photoMesh) return null;
  const { imgW, imgH } = photoMesh.userData;
  const pixH = window.innerHeight * 0.6;
  const pixW = pixH * (imgW / imgH);
  return {
    x: (window.innerWidth  - pixW) / 2,
    y: (window.innerHeight - pixH) / 2,
    w: pixW, h: pixH,
  };
}

// Geometry of the vignette ellipse at the dist=0.7 iso-contour (mid-fade)
// Semi-axes in UV:  rx_uv = aspect * ellipseRatio * 0.35 / scale
//                  ry_uv = 0.35 / scale
// The right-edge handle sits at (cx + rx_uv, cy) in UV space.
function ellipseGeometry() {
  if (!photoMesh) return null;
  const { imgW, imgH } = photoMesh.userData;
  const b = photoPixelBounds();
  if (!b) return null;
  const aspect = imgW / imgH;
  const k      = 0.35 / vignetteScale;          // common radius factor
  const rx_uv  = aspect * ellipseRatio * k;
  const ry_uv  = k;
  const cx_px  = b.x + vignetteCenter.x * b.w;
  const cy_px  = b.y + vignetteCenter.y * b.h;
  return {
    cx_px, cy_px,
    rx_px: rx_uv * b.w,
    ry_px: ry_uv * b.h,
    ex_px: b.x + (vignetteCenter.x + rx_uv) * b.w,  // right-edge handle
    ey_px: cy_px,                                      // always at center y
  };
}

// Load a File → Three.js ShaderMaterial PlaneGeometry
function loadPhotoToMesh(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const texture       = new THREE.Texture(img);
        texture.needsUpdate = true;

        const aspect = img.naturalWidth / img.naturalHeight;
        const mat = new THREE.ShaderMaterial({
          uniforms: {
            uTexture:         { value: texture },
            uVignetteCenter:  { value: new THREE.Vector2(vignetteCenter.x, vignetteCenter.y) },
            uVignetteAspect:  { value: aspect },
            uVignetteScale:   { value: vignetteScale },
            uEllipseRatio:    { value: ellipseRatio },
            uVignetteEnabled: { value: vignetteEnabled },
            // Audio-reactive uniforms (driven by animate() each frame)
            uBass:            { value: 0 },
            uBeatStrength:    { value: 0 },
            uBeatFlash:       { value: 0 },
            uTime:            { value: shaderTime },
            // Vignette morph uniforms
            uPulseAmount:     { value: 0 },
            uWobbleFreq:      { value: wobbleFreq },
            uWobbleAmp:       { value: 0 },
            uBreath:          { value: 0 },
            uBreatheAmount:   { value: 0 },
          },
          vertexShader,
          fragmentShader,
        });
        // 32×32 segments give enough vertices for smooth displacement
        const geo = new THREE.PlaneGeometry(1, 1, 32, 32);

        if (photoMesh) {
          photoMesh.material.uniforms.uTexture.value.dispose();
          photoMesh.material.dispose();
          photoMesh.geometry.dispose();
          scene.remove(photoMesh);
        }

        photoMesh = new THREE.Mesh(geo, mat);
        photoMesh.userData = { imgW: img.naturalWidth, imgH: img.naturalHeight, filename: file.name };
        scene.add(photoMesh);
        resizePhoto();
        console.log(`[chooon-viz] Loaded: ${file.name} (${img.naturalWidth}×${img.naturalHeight})`);
        resolve();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function updateShaderUniforms() {
  if (!photoMesh) return;
  const u = photoMesh.material.uniforms;
  u.uVignetteCenter.value.set(vignetteCenter.x, vignetteCenter.y);
  u.uVignetteScale.value    = vignetteScale;
  u.uEllipseRatio.value     = ellipseRatio;
  u.uVignetteEnabled.value  = vignetteEnabled;
}

// ═══════════════════════════════════════════════════════════════════════════════
// Overlay canvas — faint ellipse outline during adjustment
// ═══════════════════════════════════════════════════════════════════════════════
const overlayCanvas = document.getElementById('overlay-canvas');
const overlayCtx    = overlayCanvas.getContext('2d');

function resizeOverlayCanvas() {
  overlayCanvas.width  = window.innerWidth;
  overlayCanvas.height = window.innerHeight;
}
resizeOverlayCanvas();

function drawEllipseOutline() {
  overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  const eg = ellipseGeometry();
  if (!eg) return;
  overlayCtx.beginPath();
  overlayCtx.ellipse(
    eg.cx_px, eg.cy_px,
    Math.max(1, eg.rx_px), Math.max(1, eg.ry_px),
    0, 0, Math.PI * 2
  );
  overlayCtx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
  overlayCtx.lineWidth   = 1.5;
  overlayCtx.stroke();
}

function clearEllipseOutline() {
  overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
}

// ═══════════════════════════════════════════════════════════════════════════════
// Handle positioning
// ═══════════════════════════════════════════════════════════════════════════════
const handleEl     = document.getElementById('v-handle');
const edgeHandleEl = document.getElementById('v-edge-handle');

function updateCenterHandle() {
  const b = photoPixelBounds();
  if (!b) return;
  handleEl.style.left = (b.x + vignetteCenter.x * b.w) + 'px';
  handleEl.style.top  = (b.y + vignetteCenter.y * b.h) + 'px';
}

function updateEdgeHandle() {
  const eg = ellipseGeometry();
  if (!eg) return;
  edgeHandleEl.style.left = eg.ex_px + 'px';
  edgeHandleEl.style.top  = eg.ey_px + 'px';
}

// Call after any vignette state change during adjustment mode
function updateAllHandles() {
  updateCenterHandle();
  updateEdgeHandle();
  // Only redraw outline when adjust UI is visible
  if (!handleEl.classList.contains('hidden')) {
    drawEllipseOutline();
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// Center handle drag — moves vignette center
// ═══════════════════════════════════════════════════════════════════════════════
let isDragging = false;

handleEl.addEventListener('mousedown', (e) => {
  e.preventDefault();
  isDragging = true;
});

// ═══════════════════════════════════════════════════════════════════════════════
// Edge handle drag — x axis → scale,  y axis → ellipseRatio
//   Drag right  → ellipse grows (scale decreases)
//   Drag left   → ellipse shrinks (scale increases)
//   Drag down   → wider / flatter (ellipseRatio increases)
//   Drag up     → taller / narrower (ellipseRatio decreases)
// ═══════════════════════════════════════════════════════════════════════════════
let isDraggingEdge = false;
let edgeDragStart  = null;  // { mouseY, startRatio }

edgeHandleEl.addEventListener('mousedown', (e) => {
  e.preventDefault();
  isDraggingEdge = true;
  edgeDragStart  = { mouseY: e.clientY, startRatio: ellipseRatio };
});

// Shared mousemove for both handle drags
window.addEventListener('mousemove', (e) => {
  if (!photoMesh) return;
  const b = photoPixelBounds();
  if (!b) return;
  const { imgW, imgH } = photoMesh.userData;
  const aspect = imgW / imgH;

  if (isDragging) {
    vignetteCenter.x = Math.max(0, Math.min(1, (e.clientX - b.x) / b.w));
    vignetteCenter.y = Math.max(0, Math.min(1, (e.clientY - b.y) / b.h));
    updateAllHandles();
    updateShaderUniforms();
  }

  if (isDraggingEdge && edgeDragStart) {
    // 1. EllipseRatio from vertical delta (compute first so scale uses updated ratio)
    const dy_norm = (e.clientY - edgeDragStart.mouseY) / b.h;
    ellipseRatio  = Math.max(0.1, Math.min(5.0, edgeDragStart.startRatio + dy_norm * 3.0));

    // 2. Scale from horizontal mouse position — handle tracks mouse x
    const handleUvX = (e.clientX - b.x) / b.w;
    const rx_uv     = Math.max(0.01, handleUvX - vignetteCenter.x);
    vignetteScale   = Math.max(0.2, Math.min(8.0, aspect * ellipseRatio * 0.35 / rx_uv));

    updateAllHandles();
    updateShaderUniforms();
  }
});

window.addEventListener('mouseup', () => {
  isDragging     = false;
  isDraggingEdge = false;
  edgeDragStart  = null;
});

// ═══════════════════════════════════════════════════════════════════════════════
// Settings — persisted via HTTP server on port 8080
// ═══════════════════════════════════════════════════════════════════════════════
const HTTP_BASE = 'http://localhost:8080';

async function loadSettings() {
  try {
    const res = await fetch(`${HTTP_BASE}/photo_settings.json`);
    if (res.ok) {
      photoSettings = await res.json();
      console.log('[chooon-viz] Settings loaded:', Object.keys(photoSettings).length, 'photo(s)');
    }
  } catch (_) {
    console.log('[chooon-viz] No existing settings (server not running or file absent)');
  }
}

async function saveSettings() {
  try {
    const res = await fetch(`${HTTP_BASE}/save_settings`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(photoSettings),
    });
    if (res.ok) console.log('[chooon-viz] Settings saved');
  } catch (err) {
    console.warn('[chooon-viz] Failed to save settings:', err);
  }
}

function initVignetteForPhoto(filename) {
  const s = photoSettings[filename];
  vignetteCenter.x = s?.cx             ?? 0.5;
  vignetteCenter.y = s?.cy             ?? 0.5;
  vignetteScale    = s?.scale          ?? 0.55;
  ellipseRatio     = s?.ellipseRatio   ?? 1.0;
  vignetteEnabled  = s?.vignetteEnabled ?? true;
}

// ═══════════════════════════════════════════════════════════════════════════════
// Counter + queue popover
// ═══════════════════════════════════════════════════════════════════════════════
const counterEl = document.getElementById('counter');
const popoverEl = document.getElementById('queue-popover');

function updateCounter() {
  if (!queue.length) { counterEl.classList.add('hidden'); return; }
  counterEl.classList.remove('hidden');
  counterEl.textContent = `${currentPhotoIdx + 1} of ${queue.length}`;
  if (appMode === 'performance') {
    counterEl.classList.add('clickable');
  } else {
    counterEl.classList.remove('clickable');
    popoverEl.classList.add('hidden');
  }
}

function buildPopover() {
  popoverEl.innerHTML = '';
  queue.forEach((file, i) => {
    const item = document.createElement('div');
    item.className   = 'pop-item' + (i === currentPhotoIdx ? ' active' : '');
    item.textContent = file.name;
    item.addEventListener('click', () => {
      popoverEl.classList.add('hidden');
      enterAdjustFromPerf(i);
    });
    popoverEl.appendChild(item);
  });
}

counterEl.addEventListener('click', () => {
  if (appMode !== 'performance') return;
  if (popoverEl.classList.contains('hidden')) {
    buildPopover();
    popoverEl.classList.remove('hidden');
  } else {
    popoverEl.classList.add('hidden');
  }
});

document.addEventListener('click', (e) => {
  if (!counterEl.contains(e.target) && !popoverEl.contains(e.target)) {
    popoverEl.classList.add('hidden');
  }
});

// ═══════════════════════════════════════════════════════════════════════════════
// Adjust UI helpers
// ═══════════════════════════════════════════════════════════════════════════════
const setupControlsEl = document.getElementById('setup-controls');

function showAdjustUI() {
  setupControlsEl.classList.remove('hidden');
  const vigCb = document.getElementById('cb-vignette');
  if (vigCb) vigCb.checked = vignetteEnabled;
  if (vignetteEnabled) {
    handleEl.classList.remove('hidden');
    edgeHandleEl.classList.remove('hidden');
  } else {
    handleEl.classList.add('hidden');
    edgeHandleEl.classList.add('hidden');
  }
  updateAllHandles();
}

function hideAdjustUI() {
  handleEl.classList.add('hidden');
  edgeHandleEl.classList.add('hidden');
  setupControlsEl.classList.add('hidden');
  clearEllipseOutline();
}

// ═══════════════════════════════════════════════════════════════════════════════
// Setup mode
// ═══════════════════════════════════════════════════════════════════════════════
async function startSetup(files) {
  queue           = files;
  setupPending    = queue.map((_, i) => i);
  appMode         = 'setup';
  editFromPerfIdx = -1;
  document.getElementById('drop-zone').classList.add('hidden');
  await showNextSetup();
}

async function showNextSetup() {
  if (!setupPending.length) { startPerformance(); return; }
  const idx  = setupPending[0];
  currentPhotoIdx = idx;
  const file = queue[idx];
  initVignetteForPhoto(file.name);
  await loadPhotoToMesh(file);
  updateShaderUniforms();
  showAdjustUI();
  updateCounter();
  console.log(`[chooon-viz] Setup: "${file.name}" — ${setupPending.length} remaining`);
}

document.getElementById('btn-lock').addEventListener('click', async () => {
  if (!photoMesh) return;
  const filename = queue[currentPhotoIdx].name;
  photoSettings[filename] = {
    cx:              vignetteCenter.x,
    cy:              vignetteCenter.y,
    scale:           vignetteScale,
    ellipseRatio:    ellipseRatio,
    vignetteEnabled: vignetteEnabled,
  };
  await saveSettings();

  if (editFromPerfIdx >= 0) {
    const returnIdx = currentPhotoIdx;
    editFromPerfIdx = -1;
    hideAdjustUI();
    startPerformance(returnIdx);
  } else {
    setupPending.shift();
    await showNextSetup();
  }
});

document.getElementById('btn-skip').addEventListener('click', async () => {
  if (!setupPending.length) return;
  setupPending.push(setupPending.shift());
  await showNextSetup();
});

document.getElementById('cb-vignette').addEventListener('change', (e) => {
  vignetteEnabled = e.target.checked;
  updateShaderUniforms();
  if (vignetteEnabled) {
    handleEl.classList.remove('hidden');
    edgeHandleEl.classList.remove('hidden');
    updateAllHandles();
  } else {
    handleEl.classList.add('hidden');
    edgeHandleEl.classList.add('hidden');
    clearEllipseOutline();
  }
});

// ═══════════════════════════════════════════════════════════════════════════════
// Performance mode
// ═══════════════════════════════════════════════════════════════════════════════
async function showPerfPhoto(idx) {
  currentPhotoIdx = idx;
  lastPhotoChangeTime = Date.now();
  const file = queue[idx];
  initVignetteForPhoto(file.name);
  await loadPhotoToMesh(file);
  updateShaderUniforms();
  updateCounter();
}

function schedulePerfAdvance() {
  if (perfTimer) clearTimeout(perfTimer);
  perfTimer = setTimeout(async () => {
    if (appMode !== 'performance') return;
    await showPerfPhoto((currentPhotoIdx + 1) % queue.length);
    schedulePerfAdvance();
  }, perfInterval);
}

async function startPerformance(startIdx = 0) {
  appMode = 'performance';
  hideAdjustUI();
  await showPerfPhoto(startIdx);
  if (!dropMode) {
    schedulePerfAdvance();
    console.log('[chooon-viz] Performance mode — timer cycling every', perfInterval / 1000, 's');
  } else {
    console.log('[chooon-viz] Performance mode — drop-triggered cycling, cooldown', dropCooldown, 's');
  }
}

async function enterAdjustFromPerf(idx) {
  if (perfTimer) { clearTimeout(perfTimer); perfTimer = null; }
  appMode         = 'setup';
  editFromPerfIdx = idx;
  currentPhotoIdx = idx;
  const file = queue[idx];
  initVignetteForPhoto(file.name);
  await loadPhotoToMesh(file);
  updateShaderUniforms();
  showAdjustUI();
  updateCounter();
  console.log(`[chooon-viz] Re-editing: "${file.name}"`);
}

// ═══════════════════════════════════════════════════════════════════════════════
// File collection — handles individual files and folder drops
// ═══════════════════════════════════════════════════════════════════════════════
async function collectFiles(dataTransfer) {
  const files = [];

  async function readEntry(entry) {
    if (entry.isFile) {
      await new Promise(resolve => {
        entry.file(f => {
          if (f.type.startsWith('image/')) files.push(f);
          resolve();
        });
      });
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      await new Promise(resolve => {
        function readBatch() {
          reader.readEntries(async (entries) => {
            if (!entries.length) { resolve(); return; }
            for (const e of entries) await readEntry(e);
            readBatch();
          });
        }
        readBatch();
      });
    }
  }

  const items = [...(dataTransfer.items || [])];
  if (items.length && typeof items[0].webkitGetAsEntry === 'function') {
    for (const item of items) {
      const entry = item.webkitGetAsEntry();
      if (entry) await readEntry(entry);
    }
  } else {
    for (const f of dataTransfer.files) {
      if (f.type.startsWith('image/')) files.push(f);
    }
  }

  return files.sort((a, b) => a.name.localeCompare(b.name));
}

// ═══════════════════════════════════════════════════════════════════════════════
// Drag-and-drop
// ═══════════════════════════════════════════════════════════════════════════════
const canvas = renderer.domElement;

window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop',     (e) => e.preventDefault());

canvas.addEventListener('dragenter', ()  => document.body.classList.add('drag-over'));
canvas.addEventListener('dragover',  (e) => e.preventDefault());
canvas.addEventListener('dragleave', ()  => document.body.classList.remove('drag-over'));

canvas.addEventListener('drop', async (e) => {
  e.preventDefault();
  document.body.classList.remove('drag-over');
  const files = await collectFiles(e.dataTransfer);
  if (!files.length) {
    console.warn('[chooon-viz] No image files found in drop');
    return;
  }
  console.log(`[chooon-viz] Collected ${files.length} image(s)`);
  await startSetup(files);
});

// ═══════════════════════════════════════════════════════════════════════════════
// WebSocket — audio data
// ═══════════════════════════════════════════════════════════════════════════════
const WS_URL    = 'ws://localhost:8765';
const RECONNECT = 2000;

function connect() {
  const ws = new WebSocket(WS_URL);

  ws.addEventListener('open', () => {
    setStatus(true);
    console.log('[chooon-viz] WebSocket connected to', WS_URL);
  });

  ws.addEventListener('message', (event) => {
    try {
      const data = JSON.parse(event.data);

      // Store latest values for the animate() loop to consume
      audioData.beat         = data.beat;
      audioData.beatStrength = data.beat_strength;
      audioData.volume       = data.volume;
      audioData.bandEnergy   = data.band_energy;
      audioData.dominantFreq = data.dominant_freq;
      audioData.dropDetected = data.drop_detected ?? false;

      // Spike decaying values on each detected beat — beatSensitivity scales magnitude
      if (data.beat) {
        beatFlash          = Math.min(0.6, 0.3 * beatSensitivity);
        beatStrengthDecay  = Math.max(beatStrengthDecay, data.beat_strength * beatSensitivity);
        tileBeatPending    = true;   // tile scramble jump, processed in animate()
        vignettePulseDecay = 1.0;   // edge pulse spike, decays in animate()
      }

      // Drop-triggered photo advance
      if (data.drop_detected && dropMode && appMode === 'performance') {
        const now = Date.now();
        if (now - lastPhotoChangeTime > dropCooldown * 1000) {
          showPerfPhoto((currentPhotoIdx + 1) % queue.length);
        }
      }
    } catch (err) {
      console.warn('[chooon-viz] Failed to parse message:', event.data);
    }
  });

  ws.addEventListener('close', () => {
    setStatus(false);
    console.log('[chooon-viz] WebSocket closed. Reconnecting in', RECONNECT, 'ms…');
    setTimeout(connect, RECONNECT);
  });

  ws.addEventListener('error', (err) => {
    console.error('[chooon-viz] WebSocket error:', err);
    ws.close();
  });
}

// ═══════════════════════════════════════════════════════════════════════════════
// BroadcastChannel — receives param updates from controls.html
// ═══════════════════════════════════════════════════════════════════════════════
const ctrlChannel = new BroadcastChannel('chooon-viz-controls');

ctrlChannel.addEventListener('message', (event) => {
  const msg = event.data;
  if (!msg || msg.type !== 'param') return;
  const { key, value } = msg;

  switch (key) {
    case 'echoDecay':       echoDecay       = value; break;
    case 'echoRotation':    echoRotation    = value; break;
    case 'echoScale':       echoScale       = value; break;
    case 'perfCycleTime':   perfInterval    = value * 1000; break;  // slider sends seconds
    case 'beatSensitivity': beatSensitivity = value; break;
    case 'effectIntensity': effectIntensity = value; break;
    case 'tileEnabled':     tileEnabled     = !!value; break;
    case 'tileGrid':        tileGrid        = Math.max(2, Math.min(8, Math.round(value))); break;
    case 'tileScramble':    tileScramble    = value; break;
    case 'kaleidEnabled':   kaleidEnabled   = !!value; break;
    case 'kaleidFolds':     kaleidFolds     = Math.max(2, Math.min(8, Math.round(value))); break;
    case 'dropMode':
      dropMode = !!value;
      if (appMode === 'performance') {
        if (perfTimer) { clearTimeout(perfTimer); perfTimer = null; }
        if (!dropMode) schedulePerfAdvance();
      }
      break;
    case 'dropCooldown':     dropCooldown     = Math.round(value); break;
    case 'pulseEnabled':     pulseEnabled     = !!value; break;
    case 'pulseAmplitude':   pulseAmplitude   = value;   break;
    case 'wobbleEnabled':    wobbleEnabled    = !!value; break;
    case 'wobbleFreq':       wobbleFreq       = value;   break;
    case 'wobbleAmp':        wobbleAmp        = value;   break;
    case 'breatheEnabled':   breatheEnabled   = !!value; break;
    case 'breatheAmplitude': breatheAmplitude = value;   break;
    default: console.warn('[chooon-viz] Unknown param:', key);
  }

  console.log(`[chooon-viz] ← ${key} = ${value}`);
});

// ═══════════════════════════════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════════════════════════════
loadSettings();
connect();
</script>
